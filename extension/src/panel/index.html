<!doctype html>
<!-- Downshift side panel (PR B8). Owner: B / Junaid.
     MV3: no inline scripts — all behaviour lives in external .mjs modules. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TokenWise</title>
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
    <!-- One pixel-art pickaxe, recoloured per tier through CSS variables. -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
      <symbol id="pick" viewBox="0 0 16 16">
        <path class="pk-dark" d="M3 1h4v1h-4zM3 2h1v1h-1zM7 2h2v1h-2zM3 3h3v1h-3zM9 3h1v1h-1zM6 4h2v1h-2zM10 4h1v1h-1zM8 5h1v1h-1zM11 5h1v1h-1zM9 6h1v1h-1zM12 6h1v1h-1zM10 7h1v1h-1zM13 7h1v1h-1zM11 8h1v1h-1zM13 8h1v1h-1zM11 9h1v1h-1zM14 9h1v3h-1zM12 10h1v2h-1zM12 12h3v1h-3z" />
        <path class="pk-light" d="M4 2h3v1h-3zM6 3h3v1h-3zM8 4h2v1h-2zM9 5h2v1h-2zM10 6h2v1h-2zM11 7h2v1h-2zM12 8h1v1h-1zM12 9h2v1h-2zM13 10h1v2h-1z" />
        <path class="pk-stick" d="M12 3h1v1h-1zM8 7h1v1h-1zM6 9h1v1h-1zM4 11h1v1h-1zM2 13h1v1h-1z" />
        <path class="pk-stick2" d="M11 4h1v1h-1zM7 8h1v1h-1zM5 10h1v1h-1zM3 12h1v1h-1zM1 14h1v1h-1z" />
      </symbol>
    </svg>

    <!-- Polite live region for grid-level changes and the narrator line. -->
    <div id="live" class="visually-hidden" aria-live="polite" role="status" aria-label="Announcements"></div>

    <header class="topbar">
      <span class="grass-block" aria-hidden="true"></span>
      <div>
        <h1>TokenWise</h1>
        <span class="kicker">Grid-aware AI</span>
      </div>
    </header>

    <!-- Grid light: a beacon block in the level colour, plus the level word. -->
    <section class="gui hero" aria-label="Power grid">
      <div
        id="grid-light"
        class="grid-light"
        role="status"
        aria-label="Grid status: connecting"
      >
        <span class="beacon" aria-hidden="true"><span class="dot"></span></span>
        <div class="grid-text">
          <span class="grid-label">Grid status</span>
          <span class="grid-word" id="grid-word">Connecting</span>
          <span class="grid-load" id="grid-load"></span>
        </div>
      </div>
    </section>

    <!-- Grid Alert / note banner. role=alert so red announces assertively. -->
    <div id="banner" class="banner" role="alert" aria-live="assertive" aria-label="Grid alert"></div>

    <section class="chat narrator" aria-label="Narrator">
      <span class="tag">&lt;Narrator&gt;</span>
      <span id="narrator-text">Waiting for the engine&#8230;</span>
    </section>

    <!-- Gear shifter as a tool hotbar: radio group, arrow keys step Auto, 1..5. -->
    <section class="gui shifter" aria-labelledby="shifter-h2">
      <h2 id="shifter-h2">Pick your tool</h2>
      <div
        id="shifter"
        class="shifter-grid"
        role="radiogroup"
        aria-label="Gear shifter. Use arrow keys to change gear."
      >
        <button type="button" class="gear auto" role="radio" data-pos="auto" aria-checked="true">
          <span class="name">Auto</span>
          <span class="num">Picks the tool for each prompt</span>
          <span class="switch" aria-hidden="true"></span>
        </button>

        <div class="track">
          <button type="button" class="gear g1 t-wood" role="radio" data-pos="1" aria-checked="false">
            <span class="slot-num" aria-hidden="true">1</span>
            <svg class="pick" aria-hidden="true" focusable="false"><use href="#pick" /></svg>
            <span class="name">Wooden</span>
            <span class="num visually-hidden">Gear 1, Quick</span>
            <span class="detail">
              <span class="tip-title" aria-hidden="true">Wooden Pickaxe</span>
              <span class="tip-gear">Gear 1 · Quick</span>
              <span class="pips" aria-hidden="true"><i class="on"></i><i></i><i></i><i></i><i></i></span>
              <span class="desc">a fact, a sum, a one-line rewrite</span>
            </span>
          </button>
          <button type="button" class="gear g2 t-stone" role="radio" data-pos="2" aria-checked="false">
            <span class="slot-num" aria-hidden="true">2</span>
            <svg class="pick" aria-hidden="true" focusable="false"><use href="#pick" /></svg>
            <span class="name">Stone</span>
            <span class="num visually-hidden">Gear 2, Light</span>
            <span class="detail">
              <span class="tip-title" aria-hidden="true">Stone Pickaxe</span>
              <span class="tip-gear">Gear 2 · Light</span>
              <span class="pips" aria-hidden="true"><i class="on"></i><i class="on"></i><i></i><i></i><i></i></span>
              <span class="desc">short explanation, summarize, extract</span>
            </span>
          </button>
          <button type="button" class="gear g3 t-iron" role="radio" data-pos="3" aria-checked="false">
            <span class="slot-num" aria-hidden="true">3</span>
            <svg class="pick" aria-hidden="true" focusable="false"><use href="#pick" /></svg>
            <span class="name">Iron</span>
            <span class="num visually-hidden">Gear 3, Standard</span>
            <span class="detail">
              <span class="tip-title" aria-hidden="true">Iron Pickaxe</span>
              <span class="tip-gear">Gear 3 · Standard</span>
              <span class="pips" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i></span>
              <span class="desc">multi-paragraph writing, simple code</span>
            </span>
          </button>
          <button type="button" class="gear g4 t-diamond" role="radio" data-pos="4" aria-checked="false">
            <span class="slot-num" aria-hidden="true">4</span>
            <svg class="pick" aria-hidden="true" focusable="false"><use href="#pick" /></svg>
            <span class="name">Diamond</span>
            <span class="num visually-hidden">Gear 4, Heavy</span>
            <span class="detail">
              <span class="tip-title" aria-hidden="true">Diamond Pickaxe</span>
              <span class="tip-gear">Gear 4 · Heavy</span>
              <span class="pips" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i></span>
              <span class="desc">multi-step reasoning, real code</span>
            </span>
          </button>
          <button type="button" class="gear g5 t-netherite" role="radio" data-pos="5" aria-checked="false">
            <span class="slot-num" aria-hidden="true">5</span>
            <svg class="pick" aria-hidden="true" focusable="false"><use href="#pick" /></svg>
            <span class="name">Netherite</span>
            <span class="num visually-hidden">Gear 5, Max</span>
            <span class="detail">
              <span class="tip-title" aria-hidden="true">Netherite Pickaxe</span>
              <span class="tip-gear">Gear 5 · Max</span>
              <span class="pips" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i></span>
              <span class="desc">hard math, architecture, long writing</span>
            </span>
          </button>
        </div>
      </div>
      <p class="shifter-help">Lighter tools use less energy. When the grid is busy, shift down.</p>
    </section>

    <!-- Answer view: a chat bar to ask, a book page for the answer. -->
    <section class="gui ask" aria-labelledby="ask-h2">
      <h2 id="ask-h2">Ask me anything</h2>
      <label for="prompt" class="visually-hidden">Your prompt</label>
      <div class="composer">
        <span class="caret" aria-hidden="true">&gt;</span>
        <textarea id="prompt" placeholder="Type a question&#8230;"></textarea>
      </div>
      <div class="row">
        <button type="button" class="btn" id="ask-btn">Ask</button>
        <label class="toggle">
          <input type="checkbox" id="protected" />
          <span class="toggle-text">Best answer</span>
        </label>
      </div>
      <p class="shifter-help" id="protected-help">
        Best answer never shifts down, even when the grid is busy.
      </p>

      <div id="answer" class="answer" aria-live="polite" hidden>
        <div id="answer-text" class="answer-text"></div>
        <div id="answer-meta" class="answer-meta"></div>
      </div>
      <div id="answer-error" class="error" role="alert" hidden></div>
    </section>

    <nav class="dock" aria-label="Help">
      <button type="button" class="btn secondary" id="how-btn">How it works</button>
    </nav>

    <!-- First-run guide (3 cards) -->
    <div id="guide" class="guide-overlay" role="dialog" aria-modal="true" aria-labelledby="guide-title">
      <div class="guide gui">
        <span class="grass-block big" aria-hidden="true"></span>
        <h3 id="guide-title"></h3>
        <p id="guide-body"></p>
        <div class="dots" aria-hidden="true">
          <i data-active="true"></i><i></i><i></i>
        </div>
        <div class="nav">
          <button type="button" class="btn secondary" id="guide-skip">Skip</button>
          <button type="button" class="btn" id="guide-next">Next</button>
        </div>
      </div>
    </div>

    <script type="module" src="panel.js"></script>
  </body>
</html>
